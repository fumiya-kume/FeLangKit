name: Swift CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  lint:
    name: SwiftLint (macOS)
    runs-on: macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install SwiftLint (macOS)
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          if ! command -v swiftlint &> /dev/null; then
            brew install swiftlint
          fi

      - name: Run SwiftLint
        run: swiftlint lint --quiet --reporter github-actions-logging

  build:
    name: Build (${{ matrix.configuration }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04]
        configuration: [release]
      fail-fast: false  # Don't cancel other builds if one fails
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Cache Swift toolchain (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: /opt/swift
          key: swift-6.0-ubuntu-22.04-toolchain
          restore-keys: swift-6.0-ubuntu-22.04-

      - name: Install Swift (Linux)
        if: runner.os == 'Linux'
        run: |
          if [ ! -d "/opt/swift" ]; then
            # Install dependencies for Swift
            sudo apt-get update
            sudo apt-get install -y \
              binutils \
              git \
              gnupg2 \
              libc6-dev \
              libcurl4-openssl-dev \
              libedit2 \
              libgcc-9-dev \
              libpython3.8 \
              libsqlite3-0 \
              libstdc++-9-dev \
              libxml2-dev \
              libz3-dev \
              pkg-config \
              tzdata \
              unzip \
              zlib1g-dev
            
            # Download and install Swift 6.0
            wget -q https://download.swift.org/swift-6.0-release/ubuntu2204/swift-6.0-RELEASE/swift-6.0-RELEASE-ubuntu22.04.tar.gz
            tar xzf swift-6.0-RELEASE-ubuntu22.04.tar.gz
            sudo mv swift-6.0-RELEASE-ubuntu22.04 /opt/swift
          fi
          echo "/opt/swift/usr/bin" >> $GITHUB_PATH

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            .build
            .swiftpm
          key: swiftpm-${{ matrix.configuration }}-${{ matrix.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            swiftpm-${{ matrix.configuration }}-${{ matrix.os }}-
            swiftpm-${{ matrix.os }}-

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build ${{ matrix.configuration }}
        run: swift build --configuration ${{ matrix.configuration }}

  test:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-15
            coverage: true
          - os: ubuntu-22.04
            coverage: false
      fail-fast: false
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Cache Swift toolchain (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: /opt/swift
          key: swift-6.0-ubuntu-22.04-toolchain
          restore-keys: swift-6.0-ubuntu-22.04-

      - name: Install Swift (Linux)
        if: runner.os == 'Linux'
        run: |
          if [ ! -d "/opt/swift" ]; then
            # Install dependencies for Swift
            sudo apt-get update
            sudo apt-get install -y \
              binutils \
              git \
              gnupg2 \
              libc6-dev \
              libcurl4-openssl-dev \
              libedit2 \
              libgcc-9-dev \
              libpython3.8 \
              libsqlite3-0 \
              libstdc++-9-dev \
              libxml2-dev \
              libz3-dev \
              pkg-config \
              tzdata \
              unzip \
              zlib1g-dev
            
            # Download and install Swift 6.0
            wget -q https://download.swift.org/swift-6.0-release/ubuntu2204/swift-6.0-RELEASE/swift-6.0-RELEASE-ubuntu22.04.tar.gz
            tar xzf swift-6.0-RELEASE-ubuntu22.04.tar.gz
            sudo mv swift-6.0-RELEASE-ubuntu22.04 /opt/swift
          fi
          echo "/opt/swift/usr/bin" >> $GITHUB_PATH

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            .build
            .swiftpm
          key: swiftpm-test-${{ matrix.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            swiftpm-test-${{ matrix.os }}-
            swiftpm-debug-${{ matrix.os }}-
            swiftpm-${{ matrix.os }}-

      - name: Resolve dependencies
        run: swift package resolve

      - name: Run tests (parallel + coverage)
        if: matrix.coverage
        run: swift test --parallel --enable-code-coverage

      - name: Run tests (parallel)
        if: matrix.coverage == false
        run: swift test --parallel

      - name: Upload coverage reports
        if: matrix.coverage  # Only upload from one platform to reduce redundancy
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .build/debug/codecov/
          retention-days: 7
